name: Build WarmVerb

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install cmake

      - name: Configure CMake (Universal Binary)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release

      - name: Verify Universal Binary
        run: |
          echo "=== VST3 Architecture ==="
          file build/WarmVerb_artefacts/Release/VST3/WarmVerb.vst3/Contents/MacOS/WarmVerb
          echo "=== AU Architecture ==="
          file build/WarmVerb_artefacts/Release/AU/WarmVerb.component/Contents/MacOS/WarmVerb

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: WarmVerb.vst3
          path: build/WarmVerb_artefacts/Release/VST3/WarmVerb.vst3

      - name: Upload AU
        uses: actions/upload-artifact@v4
        with:
          name: WarmVerb.component
          path: build/WarmVerb_artefacts/Release/AU/WarmVerb.component

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022"

      - name: Build
        run: cmake --build build --config Release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: WarmVerb-Windows.vst3
          path: build/WarmVerb_artefacts/Release/VST3/WarmVerb.vst3
