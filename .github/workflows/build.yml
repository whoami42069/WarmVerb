name: Build WarmVerb

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install cmake

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: WarmVerb-macOS-VST3
          path: build/WarmVerb_artefacts/Release/VST3/WarmVerb.vst3

      - name: Upload AU
        uses: actions/upload-artifact@v4
        with:
          name: WarmVerb-macOS-AU
          path: build/WarmVerb_artefacts/Release/AU/WarmVerb.component

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022"

      - name: Build
        run: cmake --build build --config Release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: WarmVerb-Windows-VST3
          path: build/WarmVerb_artefacts/Release/VST3/WarmVerb.vst3
