name: Build WarmVerb

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake with Xcode Generator
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0"

      - name: Build with CMake
        run: cmake --build build --config Release

      - name: Ad-hoc Code Sign AU Plugin
        run: |
          codesign --force --deep --sign - \
            build/WarmVerb_artefacts/Release/AU/WarmVerb.component
          echo "Verifying signature..."
          codesign -v build/WarmVerb_artefacts/Release/AU/WarmVerb.component

      - name: Ad-hoc Code Sign VST3 Plugin
        run: |
          codesign --force --deep --sign - \
            build/WarmVerb_artefacts/Release/VST3/WarmVerb.vst3
          codesign -v build/WarmVerb_artefacts/Release/VST3/WarmVerb.vst3

      - name: Verify Universal Binary
        run: |
          echo "=== AU Architecture ==="
          file build/WarmVerb_artefacts/Release/AU/WarmVerb.component/Contents/MacOS/WarmVerb
          lipo -info build/WarmVerb_artefacts/Release/AU/WarmVerb.component/Contents/MacOS/WarmVerb
          echo "=== VST3 Architecture ==="
          file build/WarmVerb_artefacts/Release/VST3/WarmVerb.vst3/Contents/MacOS/WarmVerb

      - name: Verify Bundle Structure
        run: |
          echo "=== AU Bundle Contents ==="
          ls -la build/WarmVerb_artefacts/Release/AU/WarmVerb.component/Contents/
          echo "=== Info.plist validity ==="
          plutil -lint build/WarmVerb_artefacts/Release/AU/WarmVerb.component/Contents/Info.plist

      - name: Install AU and Validate with auval
        run: |
          # Copy to system AU directory
          sudo mkdir -p /Library/Audio/Plug-Ins/Components
          sudo cp -R build/WarmVerb_artefacts/Release/AU/WarmVerb.component \
            /Library/Audio/Plug-Ins/Components/

          # Kill AudioComponentRegistrar to force rescan
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2

          # Validate AU plugin
          echo "=== AU Validation ==="
          auval -a | grep -i warm || echo "Warning: AU not found in auval -a"
          auval -v aufx Wvrb Wvba || echo "Warning: auval validation returned non-zero"

      - name: Upload AU
        uses: actions/upload-artifact@v4
        with:
          name: WarmVerb.component
          path: build/WarmVerb_artefacts/Release/AU/WarmVerb.component

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: WarmVerb.vst3
          path: build/WarmVerb_artefacts/Release/VST3/WarmVerb.vst3

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022"

      - name: Build
        run: cmake --build build --config Release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: WarmVerb-Windows.vst3
          path: build/WarmVerb_artefacts/Release/VST3/WarmVerb.vst3
